  - title: "**Mindtree Ltd** — Senior Software Engineer"
    date: Jul. 2015 - Oct. 2021
    description:
      - "Orchestrated an insight-driven automotive business intelligence system using **AWS**, improving overall reporting efficiency by 70%."
      - "Automated the ETL process by orchestrating data pipelines using **AWS Lambda** and processed terabytes of sales data using **PySpark** in **AWS Glue**."
      - "Developed ETL framework in **Azure Databricks** for data cleansing, data wrangling, standardization, variable generation, and feature engineering used by product recommendation system."
      - "Performed various optimizations in **Apache Spark** by monitoring Spark UI and analyzing query execution plans, thereby increasing throughput by 20%."
